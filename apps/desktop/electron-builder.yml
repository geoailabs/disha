appId: com.disha.desktop
productName: Disha
directories:
  buildResources: build
  output: release
files:
  - out/**/*
mac:
  target:
    - zip
  category: public.app-category.developer-tools
  artifactName: "Disha-${version}-${arch}.${ext}"
win:
  target:
    - nsis
    - zip
  artifactName: "Disha-${version}-${arch}.${ext}"
extraResources:
  - from: ../../packages/backend/dist/backend
    to: backend
    filter:
      - "**/*"
publish:
  provider: github
  owner: geoailabs
  repo: disha

